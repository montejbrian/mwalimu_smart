version: "3.9"

# ── MwalimuSmart Web — Docker Compose ────────────────────────────────────────
# Usage:
#   docker compose up -d              # start all services
#   docker compose logs -f app        # follow app logs
#   docker compose down               # stop all
#   docker compose down -v            # stop + delete volumes

services:

  # ── PostgreSQL + pgvector ─────────────────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER:     mwalimu
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mwalimupassword}
      POSTGRES_DB:       mwalimusmart
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U mwalimu -d mwalimusmart"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB ───────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD","mongosh","--eval","db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Database initialiser (runs once) ─────────────────────────────────────
  db-init:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: >
      sh -c "cd backend &&
             python3 -m scripts.init_db --seed &&
             echo 'DB init done'"
    env_file: ../.env
    environment:
      POSTGRES_DSN: postgresql://mwalimu:${DB_PASSWORD:-mwalimupassword}@postgres:5432/mwalimusmart
      MONGODB_URI:  mongodb://mongo:27017/mwalimusmart
    depends_on:
      postgres: { condition: service_healthy }
      mongo:    { condition: service_healthy }
    restart: "no"

  # ── Main web app ──────────────────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    env_file: ../.env
    environment:
      POSTGRES_DSN: postgresql://mwalimu:${DB_PASSWORD:-mwalimupassword}@postgres:5432/mwalimusmart
      MONGODB_URI:  mongodb://mongo:27017/mwalimusmart
      RENDERS_DIR:  /app/renders
      NODE_ENV:     production
    volumes:
      - renders:/app/renders
      - kicd_docs:/app/kicd_docs
    depends_on:
      postgres: { condition: service_healthy }
      mongo:    { condition: service_healthy }
      db-init:  { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL","node -e \"fetch('http://localhost:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # ── Manim render worker ───────────────────────────────────────────────────
  manim-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: sh -c "cd backend && python3 -m workers.manim_worker"
    restart: unless-stopped
    env_file: ../.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/mwalimusmart
      RENDERS_DIR: /app/renders
    volumes:
      - renders:/app/renders
    depends_on:
      mongo: { condition: service_healthy }
      app:   { condition: service_healthy }

volumes:
  postgres_data:
  mongo_data:
  renders:
  kicd_docs:
